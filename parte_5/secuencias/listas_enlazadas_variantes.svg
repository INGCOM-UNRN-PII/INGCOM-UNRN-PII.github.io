<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style type="text/css"><![CDATA[
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #192437; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #4a5a75; text-anchor: middle; }
      .panel-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #192437; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #404040; }
      .label-small { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #525252; }
      .label-strong { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #192437; }
      .panel { fill: #fafafa; stroke: #d4d4d4; stroke-width: 1.5; rx: 12; }
      .node { fill: #ffffff; stroke: #1565c0; stroke-width: 2; rx: 8; }
      .data { fill: #bbdefb; stroke: #90caf9; stroke-width: 1.5; rx: 6; }
      .ptr { fill: #e8ebf0; stroke: #90caf9; stroke-width: 1.5; rx: 6; }
      .sentinel { fill: #fce8ec; stroke: #eb2141; stroke-width: 2; rx: 8; }
      .null-box { fill: #f5f5f5; stroke: #737373; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6; }
      .arrow { fill: none; stroke: #1565c0; stroke-width: 2.5; }
      .arrow-soft { fill: none; stroke: #4a5a75; stroke-width: 2; }
      .arrow-back { fill: none; stroke: #6a1b9a; stroke-width: 2.5; }
      .accent { fill: #fce8ec; stroke: #eb2141; stroke-width: 1.5; rx: 10; }
    ]]></style>
    <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="arrow-back-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a1b9a"/>
    </marker>
    <marker id="arrow-soft-end" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4a5a75"/>
    </marker>
  </defs>

  <text x="450" y="34" class="title">Variantes de listas enlazadas</text>
  <text x="450" y="56" class="subtitle">Qué cambia en los enlaces, los extremos y los casos borde</text>

  <rect x="35" y="85" width="390" height="210" class="panel"/>
  <text x="55" y="112" class="panel-title">1. Simplemente enlazada</text>
  <text x="55" y="132" class="label">Cada nodo conoce solo a su sucesor.</text>

  <rect x="60" y="160" width="72" height="54" class="node"/>
  <rect x="132" y="160" width="72" height="54" class="node"/>
  <rect x="204" y="160" width="72" height="54" class="node"/>
  <rect x="74" y="172" width="32" height="28" class="data"/>
  <rect x="106" y="172" width="18" height="28" class="ptr"/>
  <rect x="146" y="172" width="32" height="28" class="data"/>
  <rect x="178" y="172" width="18" height="28" class="ptr"/>
  <rect x="218" y="172" width="32" height="28" class="data"/>
  <rect x="250" y="172" width="18" height="28" class="ptr"/>
  <text x="90" y="190" class="label-strong">A</text>
  <text x="162" y="190" class="label-strong">B</text>
  <text x="234" y="190" class="label-strong">C</text>
  <path d="M 124 186 L 132 186" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 196 186 L 204 186" class="arrow" marker-end="url(#arrow-end)"/>
  <rect x="292" y="172" width="52" height="28" class="null-box"/>
  <text x="307" y="190" class="label-small">null</text>
  <path d="M 268 186 L 292 186" class="arrow-soft" marker-end="url(#arrow-soft-end)"/>
  <text x="60" y="238" class="label-small">Fuerte para insertar o borrar cerca del frente.</text>
  <text x="60" y="256" class="label-small">Débil para retroceder o acceder por índice.</text>

  <rect x="475" y="85" width="390" height="210" class="panel"/>
  <text x="495" y="112" class="panel-title">2. Doblemente enlazada</text>
  <text x="495" y="132" class="label">Cada nodo mantiene referencia al anterior y al siguiente.</text>

  <rect x="500" y="160" width="92" height="60" class="node"/>
  <rect x="602" y="160" width="92" height="60" class="node"/>
  <rect x="704" y="160" width="92" height="60" class="node"/>
  <rect x="512" y="176" width="20" height="28" class="ptr"/>
  <rect x="532" y="176" width="28" height="28" class="data"/>
  <rect x="560" y="176" width="20" height="28" class="ptr"/>
  <rect x="614" y="176" width="20" height="28" class="ptr"/>
  <rect x="634" y="176" width="28" height="28" class="data"/>
  <rect x="662" y="176" width="20" height="28" class="ptr"/>
  <rect x="716" y="176" width="20" height="28" class="ptr"/>
  <rect x="736" y="176" width="28" height="28" class="data"/>
  <rect x="764" y="176" width="20" height="28" class="ptr"/>
  <text x="544" y="194" class="label-strong">A</text>
  <text x="646" y="194" class="label-strong">B</text>
  <text x="748" y="194" class="label-strong">C</text>
  <path d="M 580 188 L 602 188" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 682 188 L 704 188" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 614 204 C 606 222, 586 222, 578 204" class="arrow-back" marker-end="url(#arrow-back-end)"/>
  <path d="M 716 204 C 708 222, 688 222, 680 204" class="arrow-back" marker-end="url(#arrow-back-end)"/>
  <text x="500" y="242" class="label-small">Sirve cuando avanzar y retroceder son operaciones del dominio.</text>
  <text x="500" y="260" class="label-small">Paga más memoria e invariantes más delicadas.</text>

  <rect x="35" y="325" width="390" height="210" class="panel"/>
  <text x="55" y="352" class="panel-title">3. Circular</text>
  <text x="55" y="372" class="label">El último nodo vuelve al primero: no hay corte físico en el final.</text>

  <rect x="68" y="415" width="72" height="54" class="node"/>
  <rect x="162" y="415" width="72" height="54" class="node"/>
  <rect x="256" y="415" width="72" height="54" class="node"/>
  <rect x="82" y="427" width="32" height="28" class="data"/>
  <rect x="114" y="427" width="18" height="28" class="ptr"/>
  <rect x="176" y="427" width="32" height="28" class="data"/>
  <rect x="208" y="427" width="18" height="28" class="ptr"/>
  <rect x="270" y="427" width="32" height="28" class="data"/>
  <rect x="302" y="427" width="18" height="28" class="ptr"/>
  <text x="98" y="445" class="label-strong">A</text>
  <text x="192" y="445" class="label-strong">B</text>
  <text x="286" y="445" class="label-strong">C</text>
  <path d="M 132 441 L 162 441" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 226 441 L 256 441" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 320 438 C 368 382, 48 382, 96 438" class="arrow" marker-end="url(#arrow-end)"/>
  <text x="60" y="497" class="label-small">Útil para rondas, turnos o recorridos que no tienen "último" fuerte.</text>
  <text x="60" y="515" class="label-small">Si armás mal el ciclo, el recorrido puede no terminar donde esperabas.</text>

  <rect x="475" y="325" width="390" height="210" class="panel"/>
  <text x="495" y="352" class="panel-title">4. Con centinela</text>
  <text x="495" y="372" class="label">Un nodo estructural permanente simplifica cabeza, cola y lista vacía.</text>

  <rect x="505" y="418" width="88" height="56" class="sentinel"/>
  <rect x="625" y="418" width="72" height="56" class="node"/>
  <rect x="727" y="418" width="72" height="56" class="node"/>
  <rect x="639" y="432" width="32" height="28" class="data"/>
  <rect x="671" y="432" width="18" height="28" class="ptr"/>
  <rect x="741" y="432" width="32" height="28" class="data"/>
  <rect x="773" y="432" width="18" height="28" class="ptr"/>
  <text x="549" y="450" class="label-strong">S</text>
  <text x="655" y="450" class="label-strong">A</text>
  <text x="757" y="450" class="label-strong">B</text>
  <path d="M 593 446 L 625 446" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 689 446 L 727 446" class="arrow" marker-end="url(#arrow-end)"/>
  <path d="M 791 443 C 836 392, 492 392, 537 443" class="arrow-back" marker-end="url(#arrow-back-end)"/>
  <text x="495" y="498" class="label-small">En la variante circular, la lista vacía puede ser: S.siguiente == S.</text>
  <text x="495" y="516" class="label-small">Se paga un nodo extra, pero desaparecen varios casos borde.</text>

  <rect x="90" y="560" width="720" height="40" class="accent"/>
  <text x="450" y="585" class="label-strong" text-anchor="middle">La decisión correcta no depende del nombre de la lista: depende de qué operaciones dominan y qué invariantes estás dispuesto a mantener.</text>
</svg>
