     id="text5">BLOATERS</text>
  <text
     x="205"
     y="194"
     class="card-copy"
     id="text7"><tspan
       x="205"
       id="tspan5">Código inflado:</tspan><tspan
       x="205"
       dy="20"
       id="tspan6">métodos, clases o listas</tspan><tspan
       x="205"
       dy="20"
       id="tspan7">que crecieron demasiado.</tspan></text>
  <rect
     x="425"
