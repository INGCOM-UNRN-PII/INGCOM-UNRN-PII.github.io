     style="fill:#ffccaa" />
  <text
     x="575"
     y="165"
     class="card-title"
     id="text8">COUPLERS</text>
  <text
     x="575"
     y="194"
     class="card-copy"
     id="text10"><tspan
       x="575"
       id="tspan8">Acoplamiento excesivo:</tspan><tspan
       x="575"
       dy="20"
       id="tspan9">demasiado conocimiento</tspan><tspan
       x="575"
       dy="20"
       id="tspan10">entre clases.</tspan></text>
  <rect
     x="55"
     y="270"
     width="300"
     height="120"
     rx="16"
     class="card abusers"
     id="rect10"
