  <title
     id="title">Categorías de code smells</title>
  <desc
     id="desc">Panel con cinco categorías de code smells: Bloaters, Couplers, Object-Oriented Abusers, Dispensables y Change Preventers, cada una con una breve explicación.</desc>
  <style
     id="style1">
    .header-band {
      fill: var(--unrn-dark-blue);
    }
    .header-title {
      font-family: 'Fabrikat', Arial, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: #ffffff;
      text-anchor: middle;
    }
    .header-subtitle {
      font-family: 'Lato', Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: var(--blue-lightest);
      text-anchor: middle;
    }
    .card {
      stroke-width: 1.5;
    }
    .card-title {
      font-family: 'Fabrikat', Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: var(--unrn-dark-blue);
      text-anchor: middle;
    }
    .card-title-small {
      font-family: 'Fabrikat', Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: var(--unrn-dark-blue);
      text-anchor: middle;
    }
    .card-copy {
      font-family: 'Lato', Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: var(--gray-700);
      text-anchor: middle;
    }
    .bloaters {
      fill: var(--red-lightest);
      stroke: var(--unrn-red);
    }
    .couplers {
      fill: var(--blue-lightest);
      stroke: var(--blue-light);
    }
    .abusers {
      fill: var(--queue-data);
      stroke: var(--queue-primary);
    }
    .dispensables {
      fill: var(--gray-100);
      stroke: var(--gray-600);
    }
    .preventers {
      fill: var(--graph-data);
      stroke: var(--graph-primary);
    }
  </style>
