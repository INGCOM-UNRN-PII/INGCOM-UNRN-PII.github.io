     id="text12">ABUSERS</text>
  <text
     x="205"
     y="360"
     class="card-copy"
     id="text14"
     style="white-space:pre;inline-size:253.571;display:inline"
     xml:space="preserve"><tspan
       x="205"
       y="360"
       id="tspan1">Mal uso de OOP:la herencia o el<tspan
   y="360"
   id="tspan2"> </tspan></tspan><tspan
       x="205"
       y="377.50001"
       id="tspan3">polimorfismo se aplican mal.</tspan></text>
  <rect
     x="425"
     y="270"
     width="300"
     height="120"
     rx="16"
     class="card dispensables"
     id="rect14"
     style="fill:#80b3ff" />
  <text
     x="575"
     y="308"
     class="card-title"
     id="text15">DISPENSABLES</text>
  <text
     x="575"
     y="337"
     class="card-copy"
     id="text17"><tspan
       x="575"
       id="tspan15">Código innecesario:</tspan><tspan
       x="575"
       dy="20"
       id="tspan16">duplicaciones, comentarios</tspan><tspan
       x="575"
       dy="20"
       id="tspan17">o elementos muertos.</tspan></text>
  <rect
