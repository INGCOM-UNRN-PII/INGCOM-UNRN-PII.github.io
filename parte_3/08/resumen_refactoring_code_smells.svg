  <text
     x="478"
     y="155"
     class="section-title"
     id="text8">Code smells</text>
  <text
     x="478"
     y="183"
     class="section-copy"
     id="text10"><tspan
       x="478"
       id="tspan8">• Indicadores de problemas potenciales.</tspan><tspan
       x="478"
       dy="26"
       id="tspan9">• No son bugs, pero merecen atención.</tspan><tspan
       x="478"
       dy="26"
       id="tspan10">• Guían hacia dónde conviene refactorizar.</tspan></text>
