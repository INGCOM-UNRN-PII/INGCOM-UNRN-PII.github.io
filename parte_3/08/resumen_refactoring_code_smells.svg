  <text
     x="78"
     y="623"
     class="section-copy"
     id="text29"><tspan
       x="78"
       id="tspan28">• Extract Method/Class: dividir código grande.</tspan><tspan
       x="78"
       dy="26"
       id="tspan29">• Move Method/Field: ubicar lógica correctamente.</tspan></text>
  <text
     x="450"
     y="623"
     class="section-copy"
     id="text31"><tspan
       x="450"
       id="tspan30">• Replace Conditional with Polymorphism: eliminar switches.</tspan><tspan
       x="450"
       dy="26"
       id="tspan31">• Introduce Parameter Object: simplificar parámetros.</tspan></text>
