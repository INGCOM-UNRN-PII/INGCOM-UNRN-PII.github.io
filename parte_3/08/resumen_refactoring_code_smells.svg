  <text
     x="78"
     y="155"
     class="section-title"
     id="text4">Refactoring</text>
  <text
     x="78"
     y="183"
     class="section-copy"
     id="text7"><tspan
       x="78"
       id="tspan4">• Mejorar estructura sin cambiar comportamiento.</tspan><tspan
       x="78"
       dy="26"
       id="tspan5">• Siempre con tests como red de seguridad.</tspan><tspan
       x="78"
       dy="26"
       id="tspan6">• Cambios pequeños e incrementales.</tspan><tspan
       x="78"
       dy="26"
       id="tspan7">• Commit después de cada paso exitoso.</tspan></text>
  <rect
     x="450"
     y="120"
     width="360"
     height="190"
     rx="16"
