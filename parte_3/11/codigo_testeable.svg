  <title
     id="title">Características del código testeable</title>
  <desc
     id="desc">Panel con cinco características del código testeable: dependencias inyectadas, bajo acoplamiento, responsabilidad única, sin estado global y determinismo.</desc>
  <style
     id="style1"><![CDATA[
    .panel-frame { fill: #ffffff; stroke: var(--unrn-dark-blue); stroke-width: 2.5; }
    .header-band { fill: var(--unrn-dark-blue); }
    .header-text { font-family: 'Fabrikat', Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .feature-card { fill: var(--blue-lightest); stroke: var(--blue-light); stroke-width: 2; }
    .feature-card-accent { fill: var(--red-lightest); stroke: var(--unrn-red); stroke-width: 2; }
    .feature-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: var(--unrn-dark-blue); }
    .feature-copy { font-family: 'Lato', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: var(--gray-700); }
    .check-circle { fill: #2e7d32; }
    .check-mark { font-family: 'Lato', Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .support-text { font-family: 'Lato', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: var(--gray-700); text-anchor: middle; }
  ]]></style>
