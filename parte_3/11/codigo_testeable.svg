  <text
     x="430"
     y="68"
     class="header-text"
     id="text1">CÓDIGO TESTEABLE</text>
  <text
     x="430"
     y="124"
     class="support-text"
     id="text2">Diseño orientado a dependencias reemplazables, reglas claras y estados previsibles.</text>
  <rect
     x="56"
     y="156"
     width="352"
     height="112"
     rx="16"
     class="feature-card-accent"
     id="rect2"
     style="fill:#eeffaa" />
  <circle
     cx="92"
     cy="196"
     r="14"
     class="check-circle"
     id="circle2" />
  <text
     x="92"
     y="197"
     class="check-mark"
     id="text3">✓</text>
  <text
     x="118"
     y="188"
     class="feature-title"
     id="text4">DEPENDENCIAS INYECTADAS</text>
  <text
     x="118"
     y="210"
     class="feature-copy"
     id="text5"><tspan
       x="118"
       dy="0"
       id="tspan4">Las dependencias entran por constructor o método.</tspan><tspan
       x="118"
       dy="18"
       id="tspan5">No se fijan adentro con new.</tspan></text>
  <rect
     x="452"
     y="156"
     width="352"
     height="112"
     rx="16"
     class="feature-card"
     id="rect5"
     style="fill:#ccffaa" />
  <circle
     cx="488"
     cy="196"
     r="14"
     class="check-circle"
     id="circle5" />
  <text
     x="488"
     y="197"
     class="check-mark"
     id="text6">✓</text>
  <text
     x="514"
     y="188"
     class="feature-title"
     id="text7">BAJO ACOPLAMIENTO</text>
  <text
     x="514"
     y="210"
     class="feature-copy"
     id="text8"><tspan
       x="514"
       dy="0"
       id="tspan7">La clase depende de interfaces o abstracciones.</tspan><tspan
       x="514"
       dy="18"
       id="tspan8">No queda atada a implementaciones concretas.</tspan></text>
  <rect
     x="56"
     y="302"
     width="352"
     height="112"
     rx="16"
     class="feature-card"
     id="rect8"
     style="fill:#ddff55" />
  <circle
     cx="92"
     cy="342"
     r="14"
     class="check-circle"
     id="circle8" />
  <text
     x="92"
     y="343"
     class="check-mark"
     id="text9">✓</text>
  <text
     x="118"
     y="334"
     class="feature-title"
     id="text10">RESPONSABILIDAD ÚNICA</text>
  <text
     x="118"
     y="356"
     class="feature-copy"
     id="text11"><tspan
       x="118"
       dy="0"
       id="tspan10">Menos responsabilidades implican menos</tspan><tspan
       x="118"
       dy="18"
       id="tspan11">escenarios y menos combinaciones a cubrir.</tspan></text>
  <rect
     x="452"
     y="302"
     width="352"
     height="112"
     rx="16"
     class="feature-card-accent"
     id="rect11"
     style="fill:#99ff55" />
  <circle
     cx="488"
     cy="342"
     r="14"
     class="check-circle"
     id="circle11" />
  <text
     x="488"
     y="343"
     class="check-mark"
     id="text12">✓</text>
  <text
     x="514"
     y="334"
     class="feature-title"
     id="text13">SIN ESTADO GLOBAL</text>
  <text
     x="514"
     y="356"
     class="feature-copy"
     id="text14"><tspan
       x="514"
       dy="0"
       id="tspan13">Evita singletons, estáticos mutables y</tspan><tspan
       x="514"
       dy="18"
       id="tspan14">estado compartido difícil de aislar.</tspan></text>
  <rect
     x="160"
     y="448"
     width="540"
     height="112"
     rx="16"
     class="feature-card"
     id="rect14"
     style="fill:#aaffcc" />
  <circle
     cx="196"
     cy="488"
     r="14"
     class="check-circle"
     id="circle14" />
  <text
     x="196"
     y="489"
     class="check-mark"
     id="text15">✓</text>
  <text
     x="222"
     y="480"
     class="feature-title"
     id="text16">DETERMINÍSTICO</text>
  <text
     x="222"
     y="502"
     class="feature-copy"
     id="text17"><tspan
       x="222"
       dy="0"
       id="tspan16">Con el mismo input produce el mismo output.</tspan><tspan
       x="222"
       dy="18"
       id="tspan17">No depende de hora actual, azar ni recursos externos impredecibles.</tspan></text>
