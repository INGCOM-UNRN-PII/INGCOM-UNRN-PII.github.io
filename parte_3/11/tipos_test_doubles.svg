     id="path1" />
  <text
     x="430"
     y="68"
     class="header-text"
     id="text1">TIPOS DE TEST DOUBLES</text>
  <text
     x="430"
     y="124"
     class="support-text"
     id="text2">Cada doble reemplaza una dependencia real con un objetivo distinto.</text>
  <rect
     x="56"
     y="156"
     width="230"
     height="180"
     rx="16"
     class="card dummy"
     id="rect2"
     style="fill:#e9ddaf;stroke:#eea905;stroke-opacity:1" />
  <text
     x="171"
     y="196"
     class="card-title"
     id="text3">DUMMY</text>
  <text
     x="171"
     y="232"
     class="card-copy"
     id="text5"><tspan
       x="171"
       dy="0"
       id="tspan3">Objeto que se pasa pero</tspan><tspan
       x="171"
       dy="18"
       id="tspan4">no se usa realmente.</tspan><tspan
       x="171"
       dy="18"
       id="tspan5">Solo completa parámetros.</tspan></text>
  <rect
     x="315"
     y="156"
     width="230"
     height="180"
     rx="16"
     class="card stub"
     id="rect5"
     style="fill:#ffd5d5;stroke:#cb4b4b;stroke-opacity:1" />
  <text
     x="430"
     y="196"
     class="card-title"
     id="text6">STUB</text>
  <text
     x="430"
     y="232"
     class="card-copy"
     id="text8"><tspan
       x="430"
       dy="0"
       id="tspan6">Devuelve respuestas</tspan><tspan
       x="430"
       dy="18"
       id="tspan7">predefinidas a llamadas.</tspan><tspan
       x="430"
       dy="18"
       id="tspan8">No verifica interacciones.</tspan></text>
  <rect
     x="574"
     y="156"
     width="230"
     height="180"
     rx="16"
     class="card spy"
     id="rect8" />
  <text
     x="689"
     y="196"
     class="card-title"
     id="text9">SPY</text>
  <text
     x="689"
     y="232"
     class="card-copy"
     id="text11"><tspan
       x="689"
       dy="0"
       id="tspan9">Stub que además registra</tspan><tspan
       x="689"
       dy="18"
       id="tspan10">cómo fue llamado.</tspan><tspan
       x="689"
       dy="18"
       id="tspan11">Sirve para inspeccionar uso.</tspan></text>
  <rect
     x="108"
     y="380"
     width="290"
     height="220"
     rx="16"
     class="card mock"
     id="rect11"
     style="fill:#afc3e9;stroke:#1c4fed;stroke-opacity:1;fill-opacity:1" />
  <text
     x="253"
     y="420"
     class="card-title"
     id="text12">MOCK</text>
  <text
     x="253"
     y="458"
     class="card-copy"
     id="text15"><tspan
       x="253"
       dy="0"
       id="tspan12">Tiene expectativas</tspan><tspan
       x="253"
       dy="18"
       id="tspan13">preprogramadas sobre llamadas.</tspan><tspan
       x="253"
       dy="18"
       id="tspan14">Falla si el comportamiento</tspan><tspan
       x="253"
       dy="18"
       id="tspan15">esperado no ocurre.</tspan></text>
  <rect
     x="462"
     y="380"
     width="290"
     height="220"
     rx="16"
     class="card fake"
     id="rect15" />
  <text
     x="607"
     y="420"
     class="card-title"
     id="text16">FAKE</text>
  <text
     x="607"
     y="458"
     class="card-copy"
     id="text19"><tspan
       x="607"
       dy="0"
       id="tspan16">Implementación funcional</tspan><tspan
       x="607"
       dy="18"
       id="tspan17">simplificada para testing.</tspan><tspan
       x="607"
       dy="18"
       id="tspan18">Ejemplo: base de datos</tspan><tspan
       x="607"
       dy="18"
       id="tspan19">en memoria.</tspan></text>
</svg>
