  <title
     id="title">Tipos de test doubles</title>
  <desc
     id="desc">Resumen visual de dummy, stub, spy, mock y fake con su definición breve.</desc>
  <style
     id="style1"><![CDATA[
    .panel-frame { fill: #ffffff; stroke: var(--unrn-dark-blue); stroke-width: 2.5; }
    .header-band { fill: var(--unrn-dark-blue); }
    .header-text { font-family: 'Fabrikat', Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .support-text { font-family: 'Lato', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: var(--gray-700); text-anchor: middle; }
    .card { stroke-width: 2; }
    .card-title { font-family: 'Fabrikat', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: var(--unrn-dark-blue); text-anchor: middle; }
    .card-copy { font-family: 'Lato', Arial, sans-serif; font-size: 13px; font-weight: 400; fill: var(--gray-700); text-anchor: middle; }
    .dummy { fill: var(--gray-100); stroke: var(--gray-500); }
    .stub { fill: var(--blue-lightest); stroke: var(--blue-light); }
    .spy { fill: #fff4d6; stroke: #d18b00; }
    .mock { fill: var(--red-lightest); stroke: var(--unrn-red); }
    .fake { fill: #edf7ed; stroke: #2e7d32; }
  ]]></style>
  <rect
     x="24"
     y="24"
